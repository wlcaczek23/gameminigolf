<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ukázka integrace – Fotbalgolf</title>
<style>
  :root{--bg:#0d1510;--panel:#14211a;--line:#25402f;--text:#e7f2e9;--muted:#8fae98;--gold:#ffd34d;--accent:#9be15d;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;gap:24px;padding:24px;flex-wrap:wrap;justify-content:center;}
  .phone{width:390px;height:780px;border:10px solid #000;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .phone iframe{width:100%;height:100%;border:0;display:block;}
  .side{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  h1{font-size:1.1rem;} h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
  .wallet{font-size:2.4rem;font-weight:800;color:var(--gold);}
  pre{font-size:.7rem;line-height:1.4;white-space:pre-wrap;max-height:380px;overflow:auto;color:#cfe;}
  p{font-size:.85rem;color:var(--muted);line-height:1.5;}
  label{font-size:.85rem;display:flex;gap:8px;align-items:center;}
</style>
</head>
<body>
  <div class="phone"><iframe id="game" src="index.html?app=1&close=1" title="Fotbalgolf"></iframe></div>
  <div class="side">
    <div class="card">
      <h1>📱 Ukázková aplikace</h1>
      <p>Simuluje tvou aplikaci: pošle hře <code>init</code>, přijme <code>game_complete</code>, „na serveru“ ověří výsledek, připíše odměnu a vrátí <code>reward_result</code>.</p>
    </div>
    <div class="card"><h2>Peněženka hráče</h2><div class="wallet"><span id="bal">0</span> ⭐</div></div>
    <div class="card"><label><input type="checkbox" id="daily"> Simulovat „odměnu za dnešek už má“</label></div>
    <div class="card"><h2>Události ze hry</h2><pre id="log"></pre></div>
  </div>

<script>
// ── Nastavení, které by v reálu přišlo z tvého backendu ─────────
const PAR_TABLE = [2, 3, 3, 3, 3, 3, 3, 4, 4];         // musí odpovídat HOLES v game.js
const REWARDS = { completion: 10, underPar: 20, perStrokeUnderPar: 5, holeInOne: 10 };

const frame = document.getElementById('game');
const logEl = document.getElementById('log');
let balance = 0, currentNonce = null;
const usedNonces = new Set();

function log(m) {
  const copy = Object.assign({}, m);
  if (copy.imageDataUrl) copy.imageDataUrl = copy.imageDataUrl.slice(0, 40) + '…';
  logEl.textContent = `${new Date().toLocaleTimeString()}  ${m.type}\n${JSON.stringify(copy, null, 1)}\n\n` + logEl.textContent;
}
function toGame(msg) { frame.contentWindow.postMessage(msg, '*'); }

// „Server“: vlastní výpočet odměny – hodnotám ze hry slepě nevěříme.
function serverValidateAndCredit(r) {
  if (!r.nonce || r.nonce !== currentNonce || usedNonces.has(r.nonce)) return { ok: false, message: 'Tahle hra už byla započítána.' };
  if (!Array.isArray(r.holes) || r.holes.length !== PAR_TABLE.length) return { ok: false, message: 'Neplatný výsledek.' };
  for (let i = 0; i < PAR_TABLE.length; i++) {
    const h = r.holes[i];
    if (h.par !== PAR_TABLE[i] || !Number.isInteger(h.strokes) || h.strokes < 1 || h.strokes > PAR_TABLE[i] + 5) return { ok: false, message: 'Neplatný výsledek.' };
  }
  if (r.durationMs < 9 * 4000) return { ok: false, message: 'Hra byla příliš rychlá.' };
  usedNonces.add(r.nonce);
  if (document.getElementById('daily').checked) return { ok: false, message: 'Dnešní odměnu už máš – zítra zas!' };

  const total = r.holes.reduce((a, h) => a + h.strokes, 0);
  const par = PAR_TABLE.reduce((a, b) => a + b, 0);
  const hio = r.holes.filter(h => h.strokes === 1).length;
  let credited = REWARDS.completion;
  if (total < par) credited += REWARDS.underPar + REWARDS.perStrokeUnderPar * (par - total);
  credited += REWARDS.holeInOne * hio;
  balance += credited;
  document.getElementById('bal').textContent = balance;
  return { ok: true, credited, balance };
}

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || m.source !== 'fotbalgolf') return;
  log(m);
  switch (m.type) {
    case 'ready':
      currentNonce = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
      toGame({ type: 'init', config: {
        playerName: 'Tomáš', userId: 'demo-123', nonce: currentNonce,
        appName: 'aplikaci Sportpark', rewards: REWARDS, currency: { icon: '⭐', name: 'bodů' },
        showCloseButton: true,
      } });
      break;
    case 'game_complete':
      setTimeout(() => {                           // simulace síťového požadavku
        const res = serverValidateAndCredit(m);
        toGame(Object.assign({ type: 'reward_result' }, res));
        // nová hra = nový jednorázový nonce
        currentNonce = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
        toGame({ type: 'init', config: { nonce: currentNonce } });
      }, 700);
      break;
    case 'close':
      alert('Hra požádala o zavření – tady by aplikace zavřela obrazovku s hrou.');
      break;
  }
});
</script>
</body>
</html>
