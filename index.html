<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f08">
<link rel="icon" href="assets/coin.png">
<title>Výsledkomat – Mini Fotbalgolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="game-shell">
  <header id="topbar">
    <button id="btn-close" class="icon-btn" hidden aria-label="Zpět do aplikace">✕</button>
    <div class="logo"><img id="brand-img" src="assets/logo.png" alt=""><span class="brand-txt"><b id="brand-name">VÝSLEDKOMAT</b><small>MINI FOTBALGOLF</small></span></div>
    <div class="stats">
      <div class="stat"><small>Jamka</small><b><span id="st-hole">1</span><i>/9</i></b></div>
      <div class="stat"><small>Par</small><b id="st-par">2</b></div>
      <div class="stat"><small>Údery</small><b id="st-str">0</b></div>
      <div class="stat"><small>Skóre</small><b id="st-score">0</b></div>
    </div>
    <button id="btn-sound" class="icon-btn" aria-label="Zvuk">🔊</button>
  </header>

  <main id="canvas-wrap">
    <canvas id="gc"></canvas>
    <div id="banner" class="banner"></div>
    <div id="toast" class="toast"></div>
    <div id="overlay"></div>
  </main>

  <footer id="powerbar-wrap">
    <div id="powerbar-track"><div id="powerbar-fill"></div><div class="ticks"></div></div>
    <div id="hint">Drž prst → síla se mění → pusť ve správný moment!</div>
  </footer>
</div>
<script src="game.js"></script>
</body>
</html>
